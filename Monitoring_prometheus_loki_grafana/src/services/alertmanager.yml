global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'rusushakov1@gmail.com'
  smtp_auth_username: 'rusushakov1@gmail.com'
  smtp_auth_password: 'lyhg rbuh fpfe xchr'
  smtp_require_tls: true

route:
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 4h
  receiver: 'email'

receivers:
  - name: 'email'
    email_configs:
      - to: 'rusushakov1@gmail.com'
        send_resolved: true
        headers:
          Subject: '[Alertmanager] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        html: |
          <b>[Alertmanager]</b><br>
          {{ range .Alerts }}
          <b>Status:</b> {{ .Status | toUpper }}<br>
          <b>Alert:</b> {{ .Labels.alertname }}<br>
          <b>Summary:</b> {{ .Annotations.summary }}<br>
          {{ end }}
